<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWITCH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login">
        <h1 class="welcome">BIENVENIDO</h1>
        <h2 class="title">INICIAR<br>SESION</h2>

        <form id="login-form">
            <div class="field">
                <label for="correo"><span aria-hidden="true">✉</span> Correo electrónico:</label>
                <input id="correo" name="correo" type="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="contrasena"><span aria-hidden="true">♟</span> Contraseña:</label>
                <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">INGRESAR</button>
            <p class="message" id="login-message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const loginForm = document.querySelector("#login-form");
        const loginMessage = document.querySelector("#login-message");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const email = document.querySelector("#correo").value.trim();
            const password = document.querySelector("#contrasena").value;
            const isValidAccount = email === "grup0@gmail.com" && password === "123456789";

            if (isValidAccount) {
                window.location.href = "verificacion.html";
                return;
            }

            loginMessage.textContent = "Correo electrónico o contraseña incorrectos.";
            loginMessage.classList.add("error");
            loginMessage.classList.remove("success");
        });
    </script>
</body>
</html>
